---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: "mysql"
  replicas: 2
  selector:
    matchLabels:
      app: dbapp
  template:
    metadata:
       labels:
         app: dbapp
    spec:
      imagePullSecrets:
        - name: mysecret
      containers:
        - name: mycont
          image: akhilg808/clientapp:dbimage
          ports:
            - containerPort: 3306 
          volumeMounts:
             - name: www
               mountPath: /usr/share/nginx/html 
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
