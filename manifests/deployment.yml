---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      imagePullSecrets:
       - name: mysecret    
      containers:
      - name: cont-1
        image: akhilg808/clientapp:appimage
        ports:
        - containerPort: 80
        env:
          - name: DB_HOST
            value: mysqldb
            
